<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>my ip</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         font: 600 clamp(1.5rem, 6vw, 4rem) system-ui, sans-serif; background: #111; color: #eee; }
</style>
</head>
<body>
<div id="ip">…</div>
<script>
  fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => { document.getElementById("ip").textContent = d.ip; })
    .catch(() => { document.getElementById("ip").textContent = "couldn't fetch IP"; });
</script>
</body>
</html>
