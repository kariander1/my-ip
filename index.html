<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>my ip</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         font: 600 clamp(1.5rem, 6vw, 4rem) system-ui, sans-serif; background: #111; color: #eee; }
</style>
</head>
<body>
<div id="ip">…</div>
<small id="when" style="position:fixed;bottom:1rem;font-size:.9rem;opacity:.5"></small>
<script>
  // ip.txt is written by update-ip.ps1 on the home PC: line 1 = IP, line 2 = when it changed (UTC)
  fetch("ip.txt?" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(t => {
      const [ip, when] = t.trim().split("\n");
      document.getElementById("ip").textContent = ip;
      if (when) document.getElementById("when").textContent = "since " + new Date(when).toLocaleString();
    })
    .catch(() => { document.getElementById("ip").textContent = "not published yet"; });
</script>
</body>
</html>
